# 🔹 Redirection HTTP vers HTTPS (évite le contenu dupliqué et améliore le SEO)
server {
    listen 80;
    server_name interim-online.fr www.interim-online.fr;
    return 301 https://interim-online.fr$request_uri;
}

# 🔹 Serveur principal HTTPS
server {
    listen 443 ssl http2;
    server_name interim-online.fr www.interim-online.fr;

    # Chemins de tes certificats SSL (Let’s Encrypt ou autre)
    ssl_certificate /etc/letsencrypt/live/interim-online.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/interim-online.fr/privkey.pem;

    # Sécurité SSL de base
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Racine du frontend Angular
    root /usr/share/nginx/html;
    index index.html;

    # ======================
    # 🚀 Frontend Angular
    # ======================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 🚀 Fichiers SEO : robots.txt et sitemap.xml
    location = /robots.txt {
        root /usr/share/nginx/html;
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        root /usr/share/nginx/html;
        access_log off;
        log_not_found off;
    }

    # 🚀 Gestion correcte des erreurs 404 (soft 404 → vrai 404)
    error_page 404 /index.html;

    location = /index.html {
        internal;
    }

    # ======================
    # 🚀 Backend NestJS
    # ======================
    location /api/ {
        proxy_pass http://aoggkcsscwsg8kw8o4g4scc0-191627109521:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 50M;
    }

    # 🚀 OCR
    location /ocr/ {
        proxy_pass http://46.202.129.82:9000/ocr/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50M;
    }

    # 🚀 IA
    location /ia/ {
        proxy_pass http://46.202.129.82:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50M;
    }
 
}
