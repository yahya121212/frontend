server {
    listen 80;
    server_name interim-online.fr www.interim-online.fr;

    root /usr/share/nginx/html;
    index index.html;

    # Partie frontend : sert les fichiers Angular
    location / {
        try_files $uri $uri/ /index.html;
    }
    # 🚀 Fichiers SEO : robots.txt et sitemap.xml
    location = /robots.txt {
        root /usr/share/nginx/html;
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        root /usr/share/nginx/html;
        access_log off;
        log_not_found off;
    }

    # 🚀 Gestion correcte des erreurs 404 (soft 404 → vrai 404)
    error_page 404 /index.html;

    location = /index.html {
        internal;
    }
    # Partie backend : proxy vers ton backend NestJS
    location /api/ {
        proxy_pass http://aoggkcsscwsg8kw8o4g4scc0-115506170675:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        client_max_body_size 50M;
    }

    # Partie OCR
    location /ocr/ {
        proxy_pass http://46.202.129.82:9000/ocr/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50M;
    }
      # Partie IA
    location /ia/ {
        proxy_pass http://46.202.129.82:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50M;
   }
}
